<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PulseMSP</title>
<style>
  :root {
    /* Light-gray canvas, white surfaces floating on it, heavy black type and a
       single orange accent — the design language from the reference. */
    --canvas:#ececed;
    --surface:#ffffff;
    --surface-2:#f5f5f6;
    --ink:#0a0a0a;
    --ink-2:#5a5a5e;
    --ink-3:#96969c;
    --line:rgba(0,0,0,.10);
    --line-soft:rgba(0,0,0,.06);
    --accent:#f5541e;
    --accent-soft:#fff1ec;
    --danger:#c0341a;
    --radius:18px;
    --radius-sm:12px;
    --measure:46rem;
  }

  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0;
    background:var(--canvas);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:15.5px;
    line-height:1.6;
    letter-spacing:-.005em;
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
  }

  /* Thick, round-capped outline icons throughout. */
  .icon { width:22px; height:22px; flex:none; stroke:currentColor; fill:none;
          stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
  .icon.sm { width:18px; height:18px; stroke-width:2; }

  /* ---------------------------------------------------------------- header */
  header {
    flex:none; display:flex; align-items:center; gap:.65rem;
    padding:0 1.5rem; height:58px;
    background:var(--canvas);
    border-bottom:1px solid var(--line-soft);
    position:sticky; top:0; z-index:10;
  }
  .mark { color:var(--accent); display:grid; place-items:center; }
  .wordmark { font-weight:750; font-size:1.02rem; letter-spacing:-.02em; }
  .wordmark span { color:var(--ink-3); font-weight:600; }
  header .spacer { flex:1; }
  .ghost-btn {
    display:inline-flex; align-items:center; gap:.4rem;
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    font:inherit; font-size:.82rem; font-weight:600;
    padding:.4rem .75rem; border-radius:999px; cursor:pointer;
    transition:background .12s, border-color .12s;
  }
  .ghost-btn:hover { border-color:var(--ink); }

  /* ----------------------------------------------------------------- chat */
  #scroll { flex:1; overflow-y:auto; scroll-behavior:smooth; }
  #log { max-width:var(--measure); margin:0 auto; padding:2rem 1.5rem 1rem; }

  .turn { margin:0 0 2.1rem; }
  .turn.user { display:flex; justify-content:flex-end; }
  .turn.user .body {
    background:var(--surface); border-radius:var(--radius);
    padding:.6rem 1rem; max-width:85%; white-space:pre-wrap;
    font-weight:500;
  }
  /* Agent turns sit directly on the canvas — no bubble — so the transcript
     reads as one continuous document rather than a chat app. */
  .turn.agent .body > *:first-child { margin-top:0; }
  .turn.agent .body > *:last-child { margin-bottom:0; }

  .turn.error .body {
    background:var(--accent-soft); color:var(--danger);
    border-radius:var(--radius); padding:.65rem 1rem; font-size:.9rem; font-weight:500;
  }

  /* thinking indicator */
  .thinking { display:flex; gap:5px; align-items:center; height:1.6em; }
  .thinking i { width:7px; height:7px; border-radius:50%; background:var(--ink-3);
                animation:pulse 1.2s ease-in-out infinite; }
  .thinking i:nth-child(2) { animation-delay:.15s; }
  .thinking i:nth-child(3) { animation-delay:.3s; }
  @keyframes pulse { 0%,60%,100% { opacity:.22; transform:translateY(0); } 30% { opacity:1; transform:translateY(-2px); } }

  .caret { display:inline-block; width:2.5px; height:1em; background:var(--accent);
           vertical-align:-.15em; margin-left:3px; border-radius:2px;
           animation:blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity:0; } }

  /* ------------------------------------------------------- markdown output */
  .md h1, .md h2, .md h3 { line-height:1.25; letter-spacing:-.022em; margin:1.7em 0 .5em; font-weight:750; }
  .md h1 { font-size:1.42rem; }
  .md h2 { font-size:1.2rem; }
  .md h3 { font-size:1.03rem; }
  .md p { margin:.78em 0; }
  .md ul, .md ol { margin:.65em 0; padding-left:1.3em; }
  .md li { margin:.3em 0; }
  .md li::marker { color:var(--ink-3); }
  .md li > ul, .md li > ol { margin:.25em 0; }
  .md strong { font-weight:750; }
  .md a { color:var(--accent); text-decoration:none; font-weight:600;
          border-bottom:1.5px solid rgba(245,84,30,.35); }
  .md a:hover { border-bottom-color:var(--accent); }
  .md code {
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:.85em; background:var(--surface); padding:.12em .4em;
    border-radius:6px; font-weight:500;
  }
  .md pre { background:var(--surface); border-radius:var(--radius-sm);
            padding:.9rem 1.05rem; overflow-x:auto; margin:1em 0; line-height:1.55; }
  .md pre code { background:none; padding:0; font-size:.83rem; }
  .md blockquote { margin:1em 0; padding:.15em 0 .15em 1rem;
                   border-left:3px solid var(--accent); color:var(--ink-2); }
  .md hr { border:none; border-top:1px solid var(--line); margin:1.7em 0; }
  .md img { max-width:100%; border-radius:var(--radius-sm); display:block; margin:1.1em 0; }

  .table-wrap { overflow-x:auto; margin:1.1em 0; border-radius:var(--radius-sm); background:var(--surface); }
  .md table { border-collapse:collapse; width:100%; font-size:.89rem; }
  .md th, .md td { padding:.62rem .9rem; text-align:left;
                   border-bottom:1px solid var(--line-soft); white-space:nowrap; }
  .md th { font-weight:700; color:var(--ink-2); font-size:.72rem;
           letter-spacing:.06em; text-transform:uppercase; }
  .md td { font-weight:500; }
  .md tbody tr:last-child td { border-bottom:none; }
  .md tbody tr:hover td { background:var(--surface-2); }

  /* ---------------------------------------------------------- empty state */
  #empty { max-width:var(--measure); margin:0 auto; padding:12vh 1.5rem 2rem; }
  #empty h1 { font-size:1.85rem; font-weight:760; letter-spacing:-.03em; margin:0 0 .4rem; }
  #empty p { margin:0 0 1.6rem; color:var(--ink-2); }

  /* Suggestions mirror the reference menu: a white panel, full-width rows,
     bold label left, thick outline icon right, hairline dividers between. */
  .suggestions { background:var(--surface); border-radius:var(--radius); overflow:hidden; }
  .suggestion {
    display:flex; align-items:center; gap:1rem; width:100%;
    text-align:left; font:inherit; font-size:.97rem; font-weight:600; color:var(--ink);
    background:none; border:none; padding:1rem 1.15rem; cursor:pointer;
    transition:background .12s;
  }
  .suggestion + .suggestion { box-shadow:inset 0 1px 0 var(--line-soft); }
  .suggestion:hover { background:var(--surface-2); }
  .suggestion span { flex:1; }
  .suggestion .icon { color:var(--ink); transition:color .12s; }
  .suggestion:hover .icon { color:var(--accent); }

  /* ------------------------------------------------------------- composer */
  .composer-wrap { flex:none; padding:.5rem 1.5rem 1.4rem;
                   background:linear-gradient(180deg,rgba(236,236,237,0),var(--canvas) 40%); }
  form { max-width:var(--measure); margin:0 auto; }
  .composer {
    display:flex; align-items:flex-end; gap:.5rem;
    border-radius:var(--radius); background:var(--surface);
    padding:.5rem .5rem .5rem 1.05rem;
    box-shadow:0 1px 2px rgba(0,0,0,.05), 0 10px 30px -14px rgba(0,0,0,.22);
    transition:box-shadow .14s;
  }
  .composer:focus-within { box-shadow:0 0 0 2.5px var(--ink), 0 10px 30px -14px rgba(0,0,0,.22); }
  textarea {
    flex:1; border:none; outline:none; resize:none; font:inherit; color:var(--ink);
    background:none; padding:.45rem 0; max-height:9rem; line-height:1.5; font-weight:500;
  }
  textarea::placeholder { color:var(--ink-3); font-weight:400; }
  .send {
    flex:none; width:36px; height:36px; border:none; border-radius:50%; cursor:pointer;
    background:var(--ink); color:var(--surface); display:grid; place-items:center;
    transition:background .14s, opacity .14s, transform .1s;
  }
  .send:hover:not(:disabled) { background:var(--accent); }
  .send:active:not(:disabled) { transform:scale(.94); }
  .send:disabled { opacity:.22; cursor:default; }
  .hint { text-align:center; font-size:.73rem; color:var(--ink-3); margin:.6rem 0 0; }

  @media (max-width:640px) {
    #log, #empty { padding-left:1rem; padding-right:1rem; }
    .composer-wrap { padding-left:1rem; padding-right:1rem; }
    #empty { padding-top:7vh; }
    #empty h1 { font-size:1.6rem; }
    .md th, .md td { padding:.55rem .8rem; }
  }
</style>
</head>
<body>

<!-- Icon set: thick, round-capped outlines, referenced by <use>. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="i-pulse"><path d="M3 12h4l3-8 4 16 3-8h4"/></g>
    <g id="i-alert"><path d="M12 8v5"/><path d="M12 16.5v.01"/><circle cx="12" cy="12" r="9"/></g>
    <g id="i-people"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M16 5.4a3.2 3.2 0 0 1 0 5.2"/><path d="M17.5 14.2a5.5 5.5 0 0 1 3 4.8"/></g>
    <g id="i-clock"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></g>
    <g id="i-sparkle"><path d="M11 4.5 12.7 9l4.5 1.7-4.5 1.7L11 17l-1.7-4.6L4.8 10.7 9.3 9 11 4.5Z"/><path d="M18 15.5v3.2"/><path d="M16.4 17.1h3.2"/></g>
    <g id="i-plus"><path d="M12 5v14"/><path d="M5 12h14"/></g>
    <g id="i-arrow"><path d="M12 19V5"/><path d="M5.5 11.5 12 5l6.5 6.5"/></g>
  </defs>
</svg>

<header>
  <svg class="icon mark" viewBox="0 0 24 24"><use href="#i-pulse"/></svg>
  <div class="wordmark">Pulse<span>MSP</span></div>
  <div class="spacer"></div>
  <button class="ghost-btn" id="newchat" type="button">
    <svg class="icon sm" viewBox="0 0 24 24"><use href="#i-plus"/></svg>
    New chat
  </button>
</header>

<div id="scroll">
  <div id="empty">
    <h1>What's happening on the service desk?</h1>
    <p>Ask about tickets, SLA risk, or client health. Answers come from your live data.</p>
    <div class="suggestions" id="suggestions"></div>
  </div>
  <div id="log" hidden></div>
</div>

<div class="composer-wrap">
  <form id="form">
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Ask about tickets, SLAs, or clients…" autocomplete="off" autofocus></textarea>
      <button class="send" id="send" type="submit" aria-label="Send" disabled>
        <svg class="icon sm" viewBox="0 0 24 24"><use href="#i-arrow"/></svg>
      </button>
    </div>
    <p class="hint">PulseMSP can make mistakes. Verify ticket actions before relying on them.</p>
  </form>
</div>

<script>
"use strict";

const SUGGESTIONS = [
  { text: "How many P1 tickets are open right now?", icon: "i-alert" },
  { text: "Show open tickets by client, worst SLA first", icon: "i-people" },
  { text: "Which clients are at risk of an SLA breach?", icon: "i-clock" },
  { text: "Summarize this week's volume and top root causes", icon: "i-sparkle" },
];

const $ = (id) => document.getElementById(id);
const scroller = $("scroll"), log = $("log"), empty = $("empty");
const form = $("form"), input = $("input"), sendBtn = $("send");

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function icon(id, cls) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "icon" + (cls ? " " + cls : ""));
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("aria-hidden", "true");
  const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
  use.setAttribute("href", "#" + id);
  svg.appendChild(use);
  return svg;
}

/* ============================================================================
 * Markdown renderer.
 *
 * Builds DOM nodes directly — never innerHTML — so agent output cannot inject
 * markup, and no third-party library is needed (this UI works on a locked-down
 * network with no CDN access). Supports the subset the agent actually emits:
 * headings, paragraphs, lists, GFM tables, fenced code, blockquotes, rules,
 * and inline code/bold/italic/links/images.
 * ========================================================================= */

// Only http(s) and same-origin relative URLs; blocks javascript:/data: URLs.
function safeUrl(u) {
  const s = String(u || "").trim();
  if (/^https?:\/\//i.test(s)) return s;
  if (/^\/(?!\/)/.test(s) || /^\.{0,2}\//.test(s)) return s;
  return null;
}

// Pattern source only. `inline` recurses (bold containing a link, say), so each
// call compiles its own instance — sharing one /g/ regex would let a nested call
// rewind the outer loop's lastIndex and re-match the same span forever.
const INLINE_SRC = [
  "(`+)([\\s\\S]+?)\\1",                 // 1,2  code span
  "!\\[([^\\]]*)\\]\\(([^)\\s]+)\\)",    // 3,4  image
  "\\[([^\\]]*)\\]\\(([^)\\s]+)\\)",     // 5,6  link
  "\\*\\*([\\s\\S]+?)\\*\\*",            // 7    bold
  "__([\\s\\S]+?)__",                    // 8    bold
  "(?<![*\\w])\\*([^*\\n]+)\\*",         // 9    italic
  "(?<![_\\w])_([^_\\n]+)_(?!\\w)",      // 10   italic
].join("|");

function inline(text, parent) {
  const rx = new RegExp(INLINE_SRC, "g");
  let last = 0, m;
  while ((m = rx.exec(text)) !== null) {
    if (m.index > last) parent.appendChild(document.createTextNode(text.slice(last, m.index)));
    if (m[2] != null) {
      parent.appendChild(el("code", null, m[2]));
    } else if (m[4] != null) {
      const src = safeUrl(m[4]);
      if (src) { const img = el("img"); img.src = src; img.alt = m[3] || ""; img.loading = "lazy"; parent.appendChild(img); }
      else parent.appendChild(document.createTextNode(m[3] || ""));
    } else if (m[6] != null) {
      const href = safeUrl(m[6]);
      if (href) {
        const a = el("a", null, m[5] || href);
        a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer";
        parent.appendChild(a);
      } else parent.appendChild(document.createTextNode(m[5] || ""));
    } else if (m[7] != null || m[8] != null) {
      inline(m[7] ?? m[8], parent.appendChild(el("strong")));
    } else if (m[9] != null || m[10] != null) {
      inline(m[9] ?? m[10], parent.appendChild(el("em")));
    }
    last = rx.lastIndex;
  }
  if (last < text.length) parent.appendChild(document.createTextNode(text.slice(last)));
  return parent;
}

const isTableSep = (l) => /^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/.test(l) && l.includes("-");
const splitRow = (l) => l.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map((c) => c.trim());
const listMatch = (l) => {
  const m = /^(\s*)([-*+]|\d{1,9}[.)])\s+(.*)$/.exec(l);
  return m ? { indent: m[1].replace(/\t/g, "  ").length, ordered: /\d/.test(m[2]), text: m[3] } : null;
};

function renderMarkdown(src, root) {
  const lines = String(src).replace(/\r\n?/g, "\n").split("\n");
  let i = 0;

  function block(container, minIndent) {
    while (i < lines.length) {
      const line = lines[i];

      if (!line.trim()) { i++; continue; }

      const indent = line.length - line.trimStart().length;
      if (indent < minIndent && listMatch(line)) return;

      // fenced code
      const fence = /^\s*(`{3,}|~{3,})(.*)$/.exec(line);
      if (fence) {
        i++;
        const buf = [];
        while (i < lines.length && !new RegExp("^\\s*" + fence[1][0] + "{3,}\\s*$").test(lines[i])) buf.push(lines[i++]);
        i++; // closing fence (or EOF while still streaming)
        const pre = el("pre");
        pre.appendChild(el("code", null, buf.join("\n")));
        container.appendChild(pre);
        continue;
      }

      // heading
      const h = /^\s{0,3}(#{1,6})\s+(.*)$/.exec(line);
      if (h) {
        inline(h[2].replace(/\s+#+\s*$/, ""), container.appendChild(el("h" + Math.min(h[1].length, 3))));
        i++;
        continue;
      }

      // horizontal rule
      if (/^\s{0,3}([-*_])\s*(\1\s*){2,}$/.test(line)) { container.appendChild(el("hr")); i++; continue; }

      // table
      if (line.includes("|") && i + 1 < lines.length && isTableSep(lines[i + 1])) {
        const head = splitRow(line);
        i += 2;
        const wrap = el("div", "table-wrap"), table = el("table");
        const thead = el("thead"), hr = el("tr");
        head.forEach((c) => inline(c, hr.appendChild(el("th"))));
        thead.appendChild(hr); table.appendChild(thead);
        const tbody = el("tbody");
        while (i < lines.length && lines[i].includes("|") && lines[i].trim()) {
          const tr = el("tr");
          splitRow(lines[i++]).forEach((c) => inline(c, tr.appendChild(el("td"))));
          tbody.appendChild(tr);
        }
        table.appendChild(tbody); wrap.appendChild(table); container.appendChild(wrap);
        continue;
      }

      // blockquote
      if (/^\s{0,3}>/.test(line)) {
        const buf = [];
        while (i < lines.length && /^\s{0,3}>/.test(lines[i])) buf.push(lines[i++].replace(/^\s{0,3}>\s?/, ""));
        const bq = el("blockquote");
        renderMarkdown(buf.join("\n"), bq);
        container.appendChild(bq);
        continue;
      }

      // list
      const first = listMatch(line);
      if (first) {
        const list = el(first.ordered ? "ol" : "ul");
        while (i < lines.length) {
          const item = listMatch(lines[i]);
          if (!item || item.indent < first.indent) break;
          if (item.indent > first.indent) {           // nested list -> into the last <li>
            const parentLi = list.lastElementChild || list.appendChild(el("li"));
            block(parentLi, item.indent);
            continue;
          }
          if (item.ordered !== first.ordered) break;
          i++;
          const li = el("li");
          inline(item.text, li);
          list.appendChild(li);
        }
        container.appendChild(list);
        continue;
      }

      // paragraph: consume until a blank line or the start of another block
      const buf = [];
      while (i < lines.length && lines[i].trim() && !listMatch(lines[i]) &&
             !/^\s{0,3}(#{1,6}\s|>|(`{3,}|~{3,}))/.test(lines[i]) &&
             !(lines[i].includes("|") && i + 1 < lines.length && isTableSep(lines[i + 1]))) {
        buf.push(lines[i++]);
      }
      if (buf.length) inline(buf.join("\n"), container.appendChild(el("p")));
      else i++;
    }
  }

  block(root, 0);
  return root;
}

/* ==========================================================================
 * Chat
 * ======================================================================== */

let streaming = false;
let pending = null;   // the agent turn currently being written into

function showLog() {
  if (empty.hidden) return;
  empty.hidden = true;
  log.hidden = false;
}

function addTurn(kind) {
  showLog();
  const turn = el("div", "turn " + kind);
  const body = el("div", "body" + (kind === "agent" ? " md" : ""));
  turn.appendChild(body);
  log.appendChild(turn);
  stickToBottom();
  return { turn, body };
}

function stickToBottom() {
  scroller.scrollTop = scroller.scrollHeight;
}

// Re-render the whole accumulated markdown on each frame. Messages are small,
// and re-parsing means half-finished tables and lists snap into shape as the
// remaining rows arrive instead of rendering as raw pipes.
function paint(t) {
  t.body.textContent = "";
  renderMarkdown(t.text, t.body);
  if (streaming) t.body.appendChild(el("span", "caret"));
  stickToBottom();
}

function setBusy(on) {
  streaming = on;
  sendBtn.disabled = on || !input.value.trim();
  input.disabled = on;
  if (!on) input.focus();
}

async function ask(text) {
  addTurn("user").body.textContent = text;

  const t = addTurn("agent");
  t.text = "";
  const spinner = el("div", "thinking");
  spinner.append(el("i"), el("i"), el("i"));
  t.body.appendChild(spinner);
  stickToBottom();

  setBusy(true);
  let painting = false;
  const schedule = () => {
    if (painting) return;
    painting = true;
    requestAnimationFrame(() => { painting = false; paint(t); });
  };

  const fail = (msg) => {
    if (!t.text) { t.turn.className = "turn error"; t.body.className = "body"; t.body.textContent = msg; }
    else { t.body.appendChild(el("div", null, msg)); }
    stickToBottom();
  };

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text }),
    });
    if (!res.ok || !res.body) throw new Error(`Server returned HTTP ${res.status}.`);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    let done = false;

    while (!done) {
      const { value, done: finished } = await reader.read();
      if (finished) break;
      buf += decoder.decode(value, { stream: true });

      // SSE frames are separated by a blank line.
      let idx;
      while ((idx = buf.indexOf("\n\n")) !== -1) {
        const frame = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        const payload = frame.split("\n")
          .filter((l) => l.startsWith("data:"))
          .map((l) => l.slice(5).trim())
          .join("");
        if (!payload) continue;

        let ev;
        try { ev = JSON.parse(payload); } catch { continue; }

        if (ev.type === "delta") { t.text += ev.text || ""; schedule(); }
        else if (ev.type === "replace") { t.text = ev.text || ""; schedule(); }
        else if (ev.type === "error") { streaming = false; paint(t); fail(ev.text || "Something went wrong."); }
        else if (ev.type === "done") { done = true; }
      }
    }

    streaming = false;
    if (t.text) paint(t);
    else if (t.body.querySelector(".thinking")) fail("The agent didn't return a reply.");
  } catch (e) {
    streaming = false;
    if (t.text) paint(t);
    fail("Error: " + e.message);
  } finally {
    setBusy(false);
  }
}

/* -------------------------------------------------------------- composer */

function autoGrow() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 144) + "px";
}

input.addEventListener("input", () => {
  autoGrow();
  sendBtn.disabled = streaming || !input.value.trim();
});

input.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && !ev.shiftKey) {
    ev.preventDefault();
    form.requestSubmit();
  }
});

form.addEventListener("submit", (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text || streaming) return;
  input.value = "";
  autoGrow();
  sendBtn.disabled = true;
  ask(text);
});

$("newchat").addEventListener("click", () => {
  if (streaming) return;
  log.textContent = "";
  log.hidden = true;
  empty.hidden = false;
  input.value = "";
  autoGrow();
  sendBtn.disabled = true;
  input.focus();
});

const suggestions = $("suggestions");
for (const s of SUGGESTIONS) {
  const b = el("button", "suggestion");
  b.type = "button";
  b.appendChild(el("span", null, s.text));
  b.appendChild(icon(s.icon));
  b.addEventListener("click", () => { if (!streaming) ask(s.text); });
  suggestions.appendChild(b);
}
</script>
</body>
</html>
