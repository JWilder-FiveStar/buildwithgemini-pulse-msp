<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PulseMSP • Omni Card Intelligence</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Material+Symbols+Outlined">
<style>
  :root {
    --bg-dark: #0B0F19;
    --bg-card: rgba(22, 32, 52, 0.85);
    --border-card: rgba(255, 255, 255, 0.12);
    --border-hover: rgba(59, 130, 246, 0.6);
    --accent-blue: #3B82F6;
    --accent-cyan: #06B6D4;
    --accent-emerald: #10B981;
    --accent-amber: #F59E0B;
    --accent-red: #EF4444;
    --text-primary: #F8FAFC;
    --text-secondary: #94A3B8;
    --text-muted: #64748B;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at top center, rgba(15, 23, 42, 0.9), var(--bg-dark));
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* Omni Header Bar */
  header {
    background: rgba(15, 23, 42, 0.9);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border-card);
    padding: 0.9rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }

  .logo-icon {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 700;
    box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
  }

  .brand-title {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    background: linear-gradient(to right, #FFFFFF, var(--text-secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .badge-omni {
    background: rgba(59, 130, 246, 0.15);
    border: 1px solid rgba(59, 130, 246, 0.4);
    color: var(--accent-blue);
    padding: 0.2rem 0.6rem;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  /* Quick Action Prompt Bar */
  .prompt-bar {
    display: flex;
    gap: 0.6rem;
    padding: 0.8rem 1.5rem;
    background: rgba(15, 23, 42, 0.5);
    border-bottom: 1px solid var(--border-card);
    overflow-x: auto;
  }

  .chip-btn {
    background: rgba(30, 41, 59, 0.7);
    border: 1px solid var(--border-card);
    color: var(--text-secondary);
    padding: 0.45rem 0.9rem;
    border-radius: 20px;
    font-size: 0.82rem;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .chip-btn:hover {
    background: rgba(59, 130, 246, 0.2);
    border-color: var(--accent-blue);
    color: var(--text-primary);
  }

  /* Chat Area */
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
  }

  .msg {
    display: flex;
    flex-direction: column;
    width: 100%;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    align-self: flex-end;
    max-width: 70%;
  }

  .msg.agent {
    align-self: flex-start;
    width: 100%;
  }

  .bubble {
    padding: 1rem 1.25rem;
    border-radius: 16px;
    background: rgba(30, 41, 59, 0.8);
    border: 1px solid var(--border-card);
    color: var(--text-primary);
    line-height: 1.5;
    font-size: 0.95rem;
    backdrop-filter: blur(12px);
  }

  .msg.user .bubble {
    background: linear-gradient(135deg, #2563EB, #1D4ED8);
    border: none;
    box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
  }

  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    max-width: 100%;
    width: 100%;
  }

  /* Form & Input area */
  form {
    display: flex;
    gap: 0.8rem;
    padding: 1.2rem 1.5rem;
    border-top: 1px solid var(--border-card);
    background: rgba(15, 23, 42, 0.9);
    backdrop-filter: blur(16px);
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
  }

  input {
    flex: 1;
    padding: 0.85rem 1.2rem;
    background: rgba(30, 41, 59, 0.7);
    border: 1px solid var(--border-card);
    border-radius: 12px;
    font-size: 0.95rem;
    color: var(--text-primary);
    outline: none;
    transition: all 0.2s ease;
  }

  input:focus {
    border-color: var(--accent-blue);
    box-shadow: 0 0 12px rgba(59, 130, 246, 0.25);
  }

  button.send-btn {
    padding: 0.85rem 1.5rem;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
    color: #fff;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);
  }

  button.send-btn:hover {
    opacity: 0.9;
    transform: translateY(-1px);
  }

  /* --- Omni Chat Card Renderer --- */
  .a2card {
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    border-radius: 16px;
    padding: 1.4rem;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(16px);
    width: 100%;
    margin-top: 0.4rem;
    transition: all 0.3s ease;
  }

  .a2card:hover {
    border-color: var(--border-hover);
  }

  .a2card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 0.8rem;
    margin-bottom: 0.8rem;
    border-bottom: 1px solid var(--border-card);
  }

  .a2card-title {
    font-size: 1.15rem;
    font-weight: 700;
    color: #FFF;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .a2col { display: flex; flex-direction: column; gap: 0.6rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.8rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }

  .a2text { margin: 0; line-height: 1.5; color: var(--text-primary); }
  .a2text.a2-h1 { font-size: 1.35rem; font-weight: 700; color: #FFF; }
  .a2text.a2-h2 { font-size: 1.15rem; font-weight: 700; color: var(--accent-cyan); }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; color: var(--text-primary); }
  .a2text.a2-caption { font-size: 0.85rem; color: var(--text-muted); }

  .a2divider { border: none; border-top: 1px solid var(--border-card); margin: 0.8rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 12px; display: block; border: 1px solid var(--border-card); }
  .material-symbols-outlined { font-size: 1.25rem; vertical-align: middle; color: var(--accent-cyan); }

  /* Interactive Inline Gauge Card Inside Chat Thread */
  .chat-gauge-card {
    background: rgba(15, 23, 42, 0.8);
    border: 1px solid var(--border-card);
    border-radius: 14px;
    padding: 1.2rem;
    display: flex;
    align-items: center;
    gap: 1.8rem;
    margin: 0.8rem 0;
  }

  .chat-gauge-svg {
    width: 110px;
    height: 110px;
    transform: rotate(-135deg);
    flex-shrink: 0;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo-icon">P</div>
    <div class="brand-title">PulseMSP Operations</div>
    <div class="badge-omni">CARD ENGINE</div>
  </div>
</header>

<div class="prompt-bar">
  <button class="chip-btn" onclick="sendPrompt('Show SLA performance and support tickets for Contoso Cyber')">
    <span class="material-symbols-outlined">analytics</span>
    Contoso Cyber SLA Card
  </button>
  <button class="chip-btn" onclick="sendPrompt('What active critical P1 support tickets require immediate attention?')">
    <span class="material-symbols-outlined">warning</span>
    Critical P1 Tickets Card
  </button>
  <button class="chip-btn" onclick="sendPrompt('Generate a visual IT health infographic for Acme Corp')">
    <span class="material-symbols-outlined">dashboard</span>
    Acme Corp Health Card
  </button>
  <button class="chip-btn" onclick="sendPrompt('Consult knowledge base for IT dashboard layout principles and SLA priority targets')">
    <span class="material-symbols-outlined">menu_book</span>
    MSP SLA Benchmarks
  </button>
</div>

<div id="log">
  <div class="msg agent">
    <div class="bubble rich">
      <div class="a2card">
        <div class="a2card-header">
          <div class="a2card-title">
            <span class="material-symbols-outlined">smart_toy</span>
            PulseMSP Operations Agent
          </div>
          <div class="badge-omni">READY</div>
        </div>
        <div class="a2col">
          <div class="a2text a2-h2">A2UI Card Intelligence System</div>
          <div class="a2text body">Ask me to query support tickets, analyze SLA performance, view live client health cards, or generate operational reports directly inside this chat thread.</div>
        </div>
      </div>
    </div>
  </div>
</div>

<form id="form">
  <input id="input" placeholder="Ask PulseMSP (e.g. 'Show SLA for Contoso Cyber' or 'List open P1 tickets')..." autocomplete="off" autofocus>
  <button class="send-btn">Send</button>
</form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) { 
  const e = document.createElement(tag); 
  if (cls) e.className = cls; 
  if (text != null) e.textContent = text; 
  return e; 
}

function bubble(who) {
  const m = el("div", "msg " + who);
  const b = el("div", "bubble");
  m.appendChild(b); 
  log.appendChild(m); 
  log.scrollTop = log.scrollHeight;
  return b;
}

function sendPrompt(text) {
  input.value = text;
  form.dispatchEvent(new Event("submit", { cancelable: true, bubbles: true }));
}

function createChatGaugeCard(title, pct, subtitle) {
  const card = el("div", "chat-gauge-card");
  
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "chat-gauge-svg");
  svg.setAttribute("viewBox", "0 0 100 100");
  
  const strokeMax = 188.5;
  const offset = strokeMax - (strokeMax * (pct / 100.0));
  const color = pct >= 95 ? "#10B981" : (pct >= 90 ? "#F59E0B" : "#EF4444");

  svg.innerHTML = `
    <circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="40" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round"
            stroke-dasharray="188.5" stroke-dashoffset="${offset}" style="transition: stroke-dashoffset 1.2s ease;"/>
    <text x="50" y="55" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700" transform="rotate(135 50 50)">${pct.toFixed(1)}%</text>
  `;

  const info = el("div", "a2col");
  info.appendChild(el("div", "a2text a2-h2", title));
  info.appendChild(el("div", "a2text a2-caption", subtitle || "SLA Compliance Benchmark: 98.0%"));
  
  card.appendChild(svg);
  card.appendChild(info);
  return card;
}

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { 
  return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); 
}

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); 
      kids().forEach(n => d.appendChild(n)); 
      return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); 
      kids().forEach(n => d.appendChild(n)); 
      return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); 
      return d;
    }
    case "Text": {
      const content = boundStr(props.text);
      const pctMatch = content.match(/SLA Compliance:?\s*([\d\.]+)%/i);
      if (pctMatch) {
        const val = parseFloat(pctMatch[1]);
        return createChatGaugeCard("SLA Compliance Metric", val, "Live Client Operational Performance");
      }
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = content;
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); 
      img.src = src; 
      img.alt = boundStr(props.alt) || ""; 
      return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); 
      s.textContent = iconName(boundStr(props.name) || props.name); 
      return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { 
      const spec = comps[id]; 
      childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); 
    }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { 
    const node = buildNode(rid, comps, new Set()); 
    if (node) { 
      container.appendChild(node); 
      drew = true; 
    } 
  }
  return drew;
}

function renderTextCard(textContainer, text) {
  const card = el("div", "a2card");
  
  const header = el("div", "a2card-header");
  const title = el("div", "a2card-title");
  title.innerHTML = '<span class="material-symbols-outlined">dashboard</span> PulseMSP Operations Response';
  header.appendChild(title);
  header.appendChild(el("div", "badge-omni", "LIVE METRIC"));
  card.appendChild(header);

  const col = el("div", "a2col");

  // Check text for SLA percentage to inject interactive gauge card inside chat card
  const pctMatch = text.match(/SLA Compliance Rate:?\s*\*?([\d\.]+)%\*?/i) || text.match(/([\d\.]+)%/);
  if (pctMatch) {
    const pctVal = parseFloat(pctMatch[1]);
    if (pctVal > 0 && pctVal <= 100) {
      col.appendChild(createChatGaugeCard("SLA Compliance Metric", pctVal, "Live Support Service Level Performance"));
    }
  }

  // Render text blocks cleanly inside the chat card
  const paragraphs = text.split("\n\n").filter(p => p.trim());
  paragraphs.forEach(p => {
    const pEl = el("div", "a2text", p.replace(/\*\*/g, "").replace(/#/g, ""));
    col.appendChild(pEl);
  });

  card.appendChild(col);
  textContainer.appendChild(card);
}

function renderReply(b, parts) {
  b.textContent = "";
  b.classList.add("rich");
  
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  if (a2ui.length) {
    if (!renderSurface(a2ui, b)) {
      renderTextCard(b, texts.join("\n\n"));
    }
  } else if (texts.length) {
    renderTextCard(b, texts.join("\n\n"));
  } else {
    b.textContent = "(no response)";
  }
  
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); 
  b.textContent = "…";
  
  try {
    const res = await fetch("/chat", { 
      method: "POST", 
      headers: { "Content-Type": "application/json" }, 
      body: JSON.stringify({ message: text }) 
    });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
